<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05080f">
    <title>UNIMY QMS RISE v26.0</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./mobile-responsive-fix.css">
    <style>
        /* Ensure all interactive elements are visible and clickable */
        .btn, button, a, input, select, textarea {
            min-height: 44px;
            min-width: 44px;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        /* Loading spinner */
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00f5ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Button hover effects */
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 245, 255, 0.3);
        }
        
        /* Card hover effects */
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 245, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="app-root"></div>
    <div id="modal-root"></div>
    
    <!-- Scripts in correct order -->
    <script src="./config.js"></script>
    <script src="./app.js"></script>
    <script src="./app-extra.js"></script>
    <script src="./face-auth.js"></script>
    <script src="./dean-dashboard-fix.js"></script>
    <script src="./dean-sidebar-fix.js"></script>
    <script src="./dean-rise-manager.js"></script>
    <script src="./logout-video-overlay.js"></script>
</body>
</html>
