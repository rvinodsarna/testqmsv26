<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05080f">
    <title>UNIMY QMS RISE v26.0</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./mobile-responsive-fix.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" crossorigin="anonymous"></script>
    <script>
      window.__showPasswordPanel = window.__showPasswordPanel || function () {
        var selectors = ['#password-panel', '#passwordLoginPanel', '#login-panel', '#login'];
        for (var i = 0; i < selectors.length; i += 1) {
          var panel = document.querySelector(selectors[i]);
          if (panel) {
            panel.hidden = false;
            panel.style.display = '';
            panel.removeAttribute('aria-hidden');
            return panel;
          }
        }
        return null;
      };
    </script>
</head>
<body>
    <div id="splash-screen" aria-live="polite">
        <div class="splash-content">
            <div class="splash-logo">QMS RISE</div>
            <div class="splash-loading">Loading…</div>
        </div>
    </div>
    <div id="error-boundary" class="error-boundary" hidden>
        <div>
            <h2>⚠️ Application Error</h2>
            <p id="error-message">An unexpected error occurred. Please refresh the page or contact support.</p>
            <button type="button" onclick="window.location.reload()">🔄 Refresh Page</button>
        </div>
    </div>
    <main id="app"></main>
    <div id="modal-root"></div>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
    <script src="./dean-dashboard-fix.js"></script>
    <script src="./dean-sidebar-fix.js"></script>
    <script src="./ai-faq.js"></script>
</body>
</html>
