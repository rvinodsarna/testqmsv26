<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIMY QMS RISE v25 — Dean Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
    <style>
        /* ── Reset & Variables ── */
        :root {
            --bg-deep: #050510;
            --bg-card: rgba(10, 10, 38, .78);
            --glass-border: rgba(255, 255, 255, .09);
            --cyan: #00f0ff;
            --magenta: #ff2d7a;
            --violet: #7c3aed;
            --gold: #ffd700;
            --green: #00ff9d;
            --ink: #eaf0ff;
            --ink-muted: #9fb0d0;
            --ink-subtle: #5a6a8f;
            --radius-lg: 20px;
            --radius-md: 12px;
            --glow-c: 0 0 22px rgba(0, 240, 255, .5), 0 0 60px rgba(0, 240, 255, .16);
            --font-d: 'Space Grotesk';
            --font-m: 'Space Mono';
            --font-b: 'Inter';
            --color-bg: #05051a;
            --color-surface: #0d0d2b;
            --color-surface-2: #12123a;
            --color-surface-3: #1a1a4a;
            --color-primary: #00f5ff;
            --color-accent: #ff006e;
            --color-violet: #7c3aed;
            --color-green: #00ff88;
            --color-warning: #ffb800;
            --color-ink: #e2e8f0;
            --color-ink-muted: #94a3b8;
            --color-ink-subtle: #475569;
            --color-border: rgba(0, 245, 255, 0.15);
            --color-border-muted: rgba(255, 255, 255, 0.06);
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'Space Mono', monospace;
            --font-body: 'Inter', sans-serif;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --radius-pill: 9999px;
            --shadow-card: 0 0 24px rgba(0, 245, 255, 0.08), 0 4px 16px rgba(0, 0, 0, 0.6);
            --shadow-modal: 0 0 60px rgba(0, 245, 255, 0.18), 0 24px 64px rgba(0, 0, 0, 0.8);
            --glow-cyan: 0 0 20px rgba(0, 245, 255, 0.6), 0 0 40px rgba(0, 245, 255, 0.3);
            --glow-magenta: 0 0 20px rgba(255, 0, 110, 0.6), 0 0 40px rgba(255, 0, 110, 0.3);
            --glow-violet: 0 0 20px rgba(124, 58, 237, 0.6), 0 0 40px rgba(124, 58, 237, 0.3);
            --glow-green: 0 0 20px rgba(0, 255, 136, 0.6), 0 0 40px rgba(0, 255, 136, 0.3);
            --sp-xs: 4px;
            --sp-sm: 8px;
            --sp-md: 16px;
            --sp-lg: 24px;
            --sp-xl: 32px;
            --sp-2xl: 48px;
            --sp-3xl: 64px;
            --sidebar-w: 240px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }
        html,
        body {
            height: 100%
        }
        body {
            background: #050510;
            color: var(--ink);
            font-family: var(--font-b);
            font-size: 14px;
            line-height: 1.55;
            overflow-x: hidden
        }
        #bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: radial-gradient(ellipse 55% 45% at 22% 18%, rgba(124, 58, 237, .2), transparent 60%),
                radial-gradient(ellipse 50% 50% at 78% 32%, rgba(0, 240, 255, .12), transparent 55%),
                radial-gradient(ellipse 45% 45% at 55% 85%, rgba(255, 45, 122, .1), transparent 55%),
                linear-gradient(160deg, #07081a 0%, #050510 55%, #020617 100%)
        }
        #neural {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .7;
            pointer-events: none
        }
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: .3;
            pointer-events: none;
            background-image: linear-gradient(rgba(0, 240, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 240, 255, .05) 1px, transparent 1px);
            background-size: 52px 52px;
            mask-image: radial-gradient(circle at 50% 30%, #000, transparent 75%)
        }
        .scanline {
            position: fixed;
            left: 0;
            right: 0;
            height: 140px;
            z-index: -1;
            pointer-events: none;
            background: linear-gradient(180deg, transparent, rgba(0, 240, 255, .04), transparent);
            animation: scan 7s linear infinite
        }
        @keyframes scan {
            0% {
                top: -20%
            }
            100% {
                top: 120%
            }
        }
        #login {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 30%, rgba(124, 58, 237, .16), transparent 55%), #050510;
            padding: 16px
        }
        .login-card {
            width: min(420px, 94vw);
            background: rgba(10, 10, 38, .85);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .7), 0 0 40px rgba(0, 240, 255, .12);
            animation: rise .6s cubic-bezier(.2, .9, .3, 1.2)
        }
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(26px) scale(.96)
            }
            to {
                opacity: 1;
                transform: none
            }
        }
        .login-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px
        }
        .logo-hex {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-d);
            font-weight: 800;
            font-size: 15px;
            color: #020617;
            box-shadow: var(--glow-c)
        }
        .login-title {
            font-family: var(--font-d);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -.02em
        }
        .login-sub {
            font-family: var(--font-m);
            font-size: 10px;
            color: var(--cyan);
            letter-spacing: .22em
        }
        .tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, .03);
            border-radius: 12px;
            padding: 4px;
            margin: 16px 0
        }
        .tab {
            flex: 1;
            padding: 9px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            border: none;
            background: none;
            color: var(--ink-muted)
        }
        .tab.active {
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            color: #020617
        }
        .fg {
            margin-bottom: 13px
        }
        .fl {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-bottom: 6px;
            font-family: var(--font-m)
        }
        .fi {
            width: 100%;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--ink);
            font-size: 15px;
            outline: none
        }
        .fi:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, .15)
        }
        .alert {
            display: none;
            background: rgba(255, 45, 122, .12);
            border: 1px solid rgba(255, 45, 122, .35);
            color: #ffb3cc;
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 12px;
            margin-bottom: 12px
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            border-radius: 11px;
            cursor: pointer;
            font-family: var(--font-d);
            font-weight: 700;
            font-size: 14px;
            padding: 13px 20px
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--cyan), #00b0ff);
            color: #020617;
            box-shadow: var(--glow-c)
        }
        .hint {
            margin-top: 15px;
            padding-top: 13px;
            border-top: 1px solid var(--glass-border);
            font-size: 11px;
            color: var(--ink-muted)
        }
        .hint b {
            color: var(--ink)
        }
        #app {
            display: none;
            min-height: 100vh
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            height: 64px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 20px;
            background: rgba(5, 5, 16, .88);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--glass-border)
        }
        .clock {
            margin-left: auto;
            font-family: var(--font-m);
            font-size: 13px;
            color: var(--cyan)
        }
        .clock small {
            display: block;
            color: var(--ink-muted);
            font-size: 9px
        }
        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 12px 4px 4px;
            border-radius: 999px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, .85)
        }
        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--magenta));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 12px;
            color: #020617
        }
        .uname {
            font-size: 13px;
            font-weight: 700
        }
        urole {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--gold);
            display: block
        }
        .layout {
            display: flex;
            min-height: calc(100vh - 64px)
        }
        .main {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto
        }
        .mobile-ham {
            display: none;
            background: none;
            border: 1px solid var(--glass-border);
            color: var(--ink);
            border-radius: 9px;
            padding: 7px 10px;
            font-size: 16px;
            cursor: pointer
        }
        @media(max-width:720px) {
            .mobile-ham {
                display: block
            }
        }
        .hero {
            position: relative;
            margin-bottom: 24px;
            overflow: hidden;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            background: linear-gradient(120deg, rgba(124, 58, 237, .16), rgba(0, 240, 255, .08) 50%, rgba(255, 45, 122, .12));
            padding: 28px 26px;
            box-shadow: 0 0 60px rgba(124, 58, 237, .2)
        }
        .eyebrow {
            font-family: var(--font-m);
            font-size: 11px;
            letter-spacing: .3em;
            color: var(--cyan);
            text-transform: uppercase;
            margin-bottom: 8px
        }
        .hero h1 {
            font-family: var(--font-d);
            font-size: clamp(26px, 5vw, 50px);
            font-weight: 800;
            letter-spacing: -.03em;
            line-height: 1.05;
            background: linear-gradient(90deg, #fff, var(--cyan) 40%, var(--violet) 70%, var(--magenta));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }
        .type {
            font-family: var(--font-m);
            font-size: 13px;
            color: var(--ink-muted);
            margin-top: 8px
        }
        .type b {
            color: var(--cyan)
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 20px
        }
        .kpi-card {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            background: var(--bg-card);
            padding: 20px
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--violet))
        }
        .kpi-card.m::before {
            background: linear-gradient(90deg, var(--magenta), var(--violet))
        }
        .kpi-card.g::before {
            background: linear-gradient(90deg, var(--green), var(--cyan))
        }
        .kpi-card.w::before {
            background: linear-gradient(90deg, var(--gold), var(--magenta))
        }
        .kpi-ico {
            font-size: 20px;
            margin-bottom: 9px
        }
        .kpi-val {
            font-family: var(--font-d);
            font-size: 32px;
            font-weight: 800;
            color: var(--cyan);
            line-height: 1
        }
        .kpi-card.m .kpi-val {
            color: var(--magenta)
        }
        .kpi-card.g .kpi-val {
            color: var(--green)
        }
        .kpi-card.w .kpi-val {
            color: var(--gold)
        }
        .kpi-lbl {
            font-size: 12px;
            color: var(--ink-muted);
            margin-top: 6px
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 16px;
            margin-bottom: 20px
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px
        }
        .card {
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            background: var(--bg-card);
            padding: 20px;
            animation: cardIn .5s both
        }
        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(16px)
            }
            to {
                opacity: 1;
                transform: none
            }
        }
        .card h3 {
            font-family: var(--font-d);
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 13px
        }
        .card h3 small {
            margin-left: auto;
            font-size: 10px;
            font-family: var(--font-m);
            color: var(--ink-subtle)
        }
        .feed {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px
        }
        .feed li {
            display: flex;
            gap: 11px;
            align-items: flex-start;
            padding: 11px 13px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .03);
            border-left: 2px solid var(--cyan)
        }
        .feed li.ok {
            border-left-color: var(--green)
        }
        .feed li.warn {
            border-left-color: var(--gold)
        }
        .feed li.danger {
            border-left-color: var(--magenta)
        }
        .f-t {
            font-size: 13px;
            color: var(--ink)
        }
        .f-s {
            font-size: 11px;
            color: var(--ink-muted)
        }
        .f-time {
            margin-left: auto;
            font-size: 10px;
            color: var(--ink-subtle);
            font-family: var(--font-m);
            white-space: nowrap
        }
        .empty {
            padding: 26px;
            text-align: center;
            color: var(--ink-muted);
            font-family: var(--font-m);
            font-size: 12px
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--ink-muted);
            font-family: var(--font-m);
            font-size: 12px;
            padding: 40px
        }
        .spin {
            border: 2px solid rgba(0, 240, 255, .2);
            border-top-color: var(--cyan);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation: rot .8s linear infinite
        }
        @keyframes rot {
            to {
                transform: rotate(360deg)
            }
        }
        footer {
            text-align: center;
            font-family: var(--font-m);
            font-size: 10px;
            color: var(--ink-subtle);
            letter-spacing: .2em;
            padding: 16px 0 26px
        }
        @media(max-width:900px) {
            .grid-2 {
                grid-template-columns: 1fr
            }
            .grid-3 {
                grid-template-columns: 1fr
            }
        }
        @media(max-width:720px) {
            .main {
                padding: 16px
            }
            .bs,
            .clock {
                display: none
            }
        }

        /* Horizontal nav */
        .horiz-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: rgba(255, 255, 255, .04);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            border: 1px solid var(--glass-border)
        }
        .horiz-nav .nav-btn {
            flex: 1 0 auto;
            padding: 10px 16px;
            border-radius: 9px;
            background: none;
            border: none;
            color: var(--ink-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            transition: all .2s
        }
        .horiz-nav .nav-btn:hover {
            background: rgba(0, 240, 255, .07);
            color: var(--ink)
        }
        .horiz-nav .nav-btn.active {
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            color: #020617;
            box-shadow: var(--glow-c)
        }
        .horiz-nav .nav-btn .ico {
            font-size: 16px
        }
        @media(max-width:600px) {
            .horiz-nav .nav-btn {
                flex: 1 0 100%
            }
        }

        /* Security panel */
        .sec-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px
        }
        .sec-card {
            background: rgba(10, 10, 38, .6);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 16px 18px
        }
        .sec-card .sec-label {
            font-family: var(--font-m);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .15em;
            color: var(--ink-subtle);
            margin-bottom: 4px
        }
        .sec-card .sec-value {
            font-family: var(--font-d);
            font-size: 18px;
            font-weight: 700;
            color: var(--ink)
        }
        .sec-card .sec-value .highlight {
            color: var(--cyan)
        }
        .sec-card .sec-value .good {
            color: var(--green)
        }
        .sec-card .sec-value .warn {
            color: var(--gold)
        }
        .sec-card .sec-value .danger {
            color: var(--magenta)
        }
        .sec-card .sec-sub {
            font-size: 11px;
            color: var(--ink-muted);
            margin-top: 3px
        }
        .sec-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 99px;
            font-family: var(--font-m);
            letter-spacing: .3px
        }
        .sec-badge.active {
            background: rgba(0, 255, 136, .15);
            color: var(--green);
            border: 1px solid rgba(0, 255, 136, .25)
        }
        .sec-badge.inactive {
            background: rgba(255, 45, 122, .12);
            color: var(--magenta);
            border: 1px solid rgba(255, 45, 122, .25)
        }
        .sec-badge.pending {
            background: rgba(255, 184, 0, .12);
            color: var(--gold);
            border: 1px solid rgba(255, 184, 0, .25)
        }
        .sec-badge.operational {
            background: rgba(0, 240, 255, .1);
            color: var(--cyan);
            border: 1px solid rgba(0, 240, 255, .2)
        }
        .sec-divider {
            border: none;
            border-top: 1px solid var(--glass-border);
            margin: 14px 0
        }
        @media(max-width:700px) {
            .sec-grid {
                grid-template-columns: 1fr
            }
        }

        .data-table {
            width: 100%;
            border-collapse: collapse
        }
        .data-table th {
            text-align: left;
            padding: var(--sp-sm) var(--sp-md);
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--color-ink-subtle);
            border-bottom: 1px solid var(--color-border)
        }
        .data-table td {
            padding: var(--sp-sm) var(--sp-md);
            border-bottom: 1px solid var(--color-border-muted);
            font-size: 13px;
            vertical-align: middle
        }
        .data-table tr:hover td {
            background: rgba(0, 245, 255, .04)
        }
        .table-wrap {
            overflow-x: auto
        }
    </style>
</head>
<body>
    <div id="bg"></div>
    <canvas id="neural"></canvas>
    <div class="grid-overlay"></div>
    <div class="scanline"></div>

    <!-- LOGIN -->
    <div id="login">
        <div class="login-card">
            <div class="login-logo"><div class="logo-hex">Q</div>
                <div><div class="login-title">UNIMY QMS RISE</div><div class="login-sub">DEAN COMMAND CENTER · v25</div></div>
            </div>
            <div class="tabs"><button class="tab active" onclick="setTab('student',this)">Student</button><button class="tab" onclick="setTab('staff',this)">Staff</button></div>
            <div class="alert" id="alert"></div>
            <div class="fg"><div class="fl">Email Address</div><input class="fi" id="email" placeholder="name@unimy.edu.my"></div>
            <div class="fg"><div class="fl">Password</div><input class="fi" type="password" id="pwd" placeholder="password123"></div>
            <button class="btn btn-primary" onclick="login()">⚡ Launch QMS RISE</button>
            <div class="hint">Demo: <b>dean@unimy.edu.my</b> / password123 · student@unimy.edu.my / password123</div>
        </div>
    </div>

    <!-- APP -->
    <div id="app">
        <header class="topbar">
            <button class="mobile-ham" onclick="toggleNav()">☰</button>
            <div class="clock" id="clock"></div>

                const p = Math.min(1, (now - d0) / dur);

        // ─── Neural background ──────────────────────────────────────────────────────────
        (() => {
            const c = document.getElementById('neural'),
                x = c.getContext('2d');
            let w,
                h = innerHeight,
                pts = [];

            function size() {
                w = c.width = innerWidth;
                h = c.height = innerHeight;
                const n = Math.min(70, Math.floor(w * h / 20000));
                pts = [];
                for (let i = 0; i < n; i++) pts.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - .5) * .5,
                    vy: (Math.random() - .5) * .5,
                    r: Math.random() * 2 + 1
                });
            }
            size();
            addEventListener('resize', size);
            (function draw() {
                x.clearRect(0, 0, w, h);
                pts.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > w) p.vx *= -1;
                    if (p.y < 0 || p.y > h) p.vy *= -1;
                    x.beginPath();
                    x.arc(p.x, p.y, p.r, 0, 7);
                    x.fillStyle = 'rgba(0,240,255,.55)';
                    x.fill();
                });
                for (let i = 0; i < pts.length; i++) {
                    for (let j = i + 1; j < pts.length; j++) {
                        const a = pts[i],
                            b = pts[j],
                            d = Math.hypot(a.x - b.x, a.y - b.y);
                        if (d < 120) {
                            x.strokeStyle = 'rgba(0,240,255,' + (0.10 * (1 - d / 120)) + ')';
                            x.beginPath();
                            x.moveTo(a.x, a.y);
                            x.lineTo(b.x, b.y);
                            x.stroke();
                        }
                    }
                }
                requestAnimationFrame(draw);
            })();
        })();

                return w >= 4 ? 4 : (w < 0 ? 4 : w);

            const evB = [0, 0, 0, 0, 0],

                '<div><span style="font-size:10px;color:var(--ink-subtle);">Auth Method</span><br><span style="font-weight:600;color:var(--cyan);">Multi-Factor Auth</span></div>' +
                '<div><span style="font-size:10px;color:var(--ink-subtle);">Session Timeout</span><br><span style="font-weight:600;color:var(--cyan);">30 minutes</span></div>' +
                '<div><span style="font-size:10px;color:var(--ink-subtle);">Password Policy</span><br><span style="font-weight:600;color:var(--green);">Enforced (12+ chars)</span></div>' +
                '<div><span style="font-size:10px;color:var(--ink-subtle);">Role-Based Access</span><br><span style="font-weight:600;color:var(--green);">● Active</span></div>' +
                '</div></div>' +

                // 📋 Review Items
                '<div class="sec-card"><div class="sec-label">📋 Review Items</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:4px;">' +
                '<div><span style="font-size:10px;color:var(--ink-subtle);">Pending Reviews</span><br><span style="font-size:22px;font-weight:800;color:var(--green);">0</span></div>' +
                '<div><span style="font-size:10px;color:var(--ink-subtle);">Compliance Status</span><br><span style="font-weight:600;color:var(--cyan);">🟢 Operational</span></div>' +
                '<div style="grid-column:1/3;"><span style="font-size:10px;color:var(--ink-subtle);">Last Audit</span><br><span style="font-weight:400;color:var(--ink-muted);">Real events will replace this list when connected</span></div>' +
                '</div></div>' +

                // ⚠️ Control Checks
                '<div class="sec-card"><div class="sec-label">⚠️ Control Checks</div>' +
                '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:4px;">' +
                '<div><span style="font-size:10px;color:var(--ink-subtle);">Protected Environment</span><br><span style="font-weight:600;color:var(--cyan);">QMS Verified</span></div>' +
                '<div><span style="font-size:10px;color:var(--ink-subtle);">Alert Generation</span><br><span style="font-weight:600;color:var(--ink-muted);">No mock alerts generated</span></div>' +
                '<div style="grid-column:1/3;"><span style="font-size:10px;color:var(--ink-subtle);">Event Logging</span><br><span style="font-weight:600;color:var(--gold);">⏳ Awaiting connection</span></div>' +
                '</div></div>' +

                '</div>' +

                // 📊 Activity Overview footer
                '<hr class="sec-divider" />' +
                '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;">' +
                '<div><span style="font-size:11px;color:var(--ink-muted);font-family:var(--font-m);">📊 A Dean-only operational view of account activity, access controls and review items.</span></div>' +
                '<div><span class="sec-badge operational">QMS RISE Security Dashboard</span> <span class="sec-badge active" style="background:rgba(255,45,122,0.1);color:var(--magenta);border-color:rgba(255,45,122,0.2);">Confidential · Dean Access Only</span></div>' +
                '</div>' +
                '<div style="margin-top:12px;font-size:10px;color:var(--ink-subtle);font-family:var(--font-m);">Last Updated: <span id="secTs">Real-time when connected</span></div>' +
                '</div>';

            renderPage(active || 'security', content);
            const ts = el('secTs');
            if (ts) ts.textContent = new Date().toLocaleString('en-MY', { day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // ─── LIVE FEED ──────────────────────────────────────────────────────────────────
        let chan = null,
            feedTimer = null;

        async function renderLive(active) {
            const content = hero('🌐 Real-Time Activity Stream', 'Live Intelligence Feed');
            renderPage(active || 'live', content);

            const main = document.getElementById('main');
            const container = document.createElement('div');
            container.innerHTML =
                '<div class="card"><h3>Live Feed <small>REALTIME · SUPABASE</small></h3><ul class="feed" id="liveFeed"></ul></div>';
            main.appendChild(container);

            const fd = el('liveFeed');

            async function seed() {
                const comps = await rows('complaints', 'status,created_at');
                const evs = await rows('evaluations', 'score,created_at');
                const crs = await rows('credit_transfers', 'status,created_at');
                const msgs = await rows('peer_chat_messages', 'sender_name,created_at');
                fd.innerHTML = '';
                // Show most recent 6 items across all tables, combine and sort by date if available
                const items = [];
                crs.forEach(r => items.push({ type: 'Credit transfer reviewed', detail: r.status || 'unspecified',
                    date: r.created_at, cls: 'warn' }));
                evs.forEach(r => items.push({ type: 'Evaluation submitted', detail: 'Score ' + (typeof r.score ===
                        'number' ? r.score : 'n/a'), date: r.created_at, cls: 'ok' }));
                comps.forEach(r => items.push({ type: 'Complaint filed', detail: r.status || 'unspecified', date: r
                        .created_at, cls: 'danger' }));
                msgs.forEach(r => items.push({ type: 'Peer message', detail: 'from ' + (r.sender_name || 'student'),
                    date: r.created_at, cls: '' }));
                // Sort by date descending, take top 10
                items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                const top = items.slice(0, 10);
                if (top.length) {
                    top.forEach(item => {
                        const cls = item.cls || '';
                        fd.innerHTML += '<li class="' + cls + '"><div><div class="f-t">' + item.type +
                            '</div><div class="f-s">' + item.detail +
                            (item.date ? ' · ' + new Date(item.date).toLocaleDateString('en-GB') : '') +
                            '</div></div></li>';
                    });
                } else {
                    fd.innerHTML = '<li><div class="empty">No recent activity yet — new records will stream here.</div></li>';
                }
            }
            seed();

            if (chan) { try { sb.removeChannel(chan); } catch (e) {} }
            try {
                chan = sb.channel('dean-realtime')
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'complaints' }, () => seed())
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'evaluations' }, () => seed())
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'credit_transfers' }, () => seed
                    ())
                    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'peer_chat_messages' }, () => seed
                    ())
                    .subscribe();
            } catch (e) {}

            clearInterval(feedTimer);
            feedTimer = setInterval(seed, 15000);
        }

        // ─── Init ──────────────────────────────────────────────────────────────────────
        (function init() {
            const c = document.getElementById('neural');
            const x = c.getContext('2d');
            c.width = x.canvas.width = innerWidth;
            c.height = x.canvas.height = innerHeight;
        })();

        function toggleNav() {
            const m = document.getElementById('main');
            if (m) m.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
